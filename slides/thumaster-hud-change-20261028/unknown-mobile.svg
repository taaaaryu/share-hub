<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360"><rect width="360" height="360" fill="white"/><g font-family="sans-serif"><rect x="10" y="5" width="340" height="47" rx="5" fill="#f5f5f5" stroke="#111"/><text x="25" y="33" font-size="18" fill="#111">空の表示領域 → 判定不能</text><rect x="10" y="85" width="340" height="47" rx="5" fill="#f5f5f5" stroke="#111"/><text x="25" y="113" font-size="18" fill="#111">画面サイズが違う → 判定不能</text><rect x="10" y="165" width="340" height="47" rx="5" fill="#f5f5f5" stroke="#111"/><text x="25" y="193" font-size="18" fill="#111">読み込みに失敗 → 判定不能</text><text x="15" y="282" font-size="22" fill="#111">「変化なし」とは区別する</text><text x="15" y="330" font-size="20" fill="#111">判定できない理由も記録する</text></g></svg>