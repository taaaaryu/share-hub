<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#111"/></marker></defs><rect width="1000" height="360" fill="#fff"/><g font-family="sans-serif" fill="#111"><text x="50" y="60" font-size="28" fill="#111">今回確認すること</text><text x="540" y="60" font-size="28" fill="#111">まだ確認していないこと</text><path d="M500,25 V300" stroke="#bbb" stroke-width="2"/><text x="50" y="125" font-size="25" fill="#111">同じ入力で同じ時刻が出るか</text><text x="50" y="185" font-size="25" fill="#111">空や不正な画像で落ちないか</text><text x="50" y="245" font-size="25" fill="#111">CPUでの処理に何秒かかるか</text><text x="540" y="125" font-size="25" fill="#111">本番動画全体での認識精度</text><text x="540" y="185" font-size="25" fill="#111">背景変化による誤検出の削減</text><text x="540" y="245" font-size="25" fill="#111">クラウド費用・OCR回数の削減</text><text x="105" y="335" font-size="23" fill="#111">部品の共通化ができたことと、精度や費用が改善したことは分けて判断します。</text></g></svg>