<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#111"/></marker></defs><rect width="1000" height="360" fill="#fff"/><g font-family="sans-serif" fill="#111"><rect x="25" y="35" width="450" height="220" rx="6" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="43" y="80" font-size="21" fill="#111">画素差分</text><text x="50" y="125" font-size="26" fill="#111">白黒の点が何％変わったか</text><text x="50" y="170" font-size="28" fill="#df151b">基準：変化率 1.5％以上</text><text x="50" y="220" font-size="23" fill="#111">0=黒、255=白。190超を白に</text><rect x="525" y="35" width="450" height="220" rx="6" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="543" y="80" font-size="21" fill="#111">テンプレート照合</text><text x="550" y="125" font-size="25" fill="#111">文字の形がどれだけ似ているか</text><text x="550" y="170" font-size="28" fill="#df151b">既存の基準値を維持</text><text x="550" y="220" font-size="23" fill="#111">類似度 0.86 / 安定確認 0.96</text><text x="80" y="320" font-size="24" fill="#111">異なる物差しなので、値を混ぜず、切り替えて比較できる形にしました。</text></g></svg>