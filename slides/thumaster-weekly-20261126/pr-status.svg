<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560"><rect width="1500" height="560" fill="#f4f4f4"/><g font-family="Arial,sans-serif" fill="#161616"><text x="70" y="78" font-size="30" fill="#525252">レビュー待ちの8本。機械チェックと人の判断は別</text><g transform="translate(100 150)"><text x="0" y="0" font-size="24">PR 1–4</text><text x="0" y="52" font-size="19" fill="#525252">自動チェックの記録なし</text><rect x="0" y="86" width="480" height="90" fill="#e0e0e0"/><text x="26" y="143" font-size="26">4本 / CI未設定</text></g><g transform="translate(650 150)"><text x="0" y="0" font-size="24">PR 5–8</text><text x="0" y="52" font-size="19" fill="#525252">登録されたチェックは成功</text><rect x="0" y="86" width="480" height="90" fill="#a7f0ba"/><text x="26" y="143" font-size="26">4本 / CI成功</text></g><g transform="translate(1200 150)"><text x="0" y="0" font-size="24">全体</text><text x="0" y="52" font-size="19" fill="#525252">open・Draft</text><rect x="0" y="86" width="230" height="90" fill="#d0e2ff"/><text x="26" y="143" font-size="26">8本</text></g><path d="M100 375H1400" stroke="#8d8d8d" stroke-width="2"/><circle cx="260" cy="375" r="22" fill="#0f62fe"/><circle cx="740" cy="375" r="22" fill="#0f62fe"/><circle cx="1240" cy="375" r="22" fill="#0f62fe"/><text x="210" y="435" font-size="21">自動テスト</text><text x="655" y="435" font-size="21">人のレビュー</text><text x="1170" y="435" font-size="21">merge</text><text x="70" y="515" font-size="20" fill="#525252">CI成功は解析精度の改善を意味しない。レビュー承認・merge・本番受入は未確認。</text></g></svg>