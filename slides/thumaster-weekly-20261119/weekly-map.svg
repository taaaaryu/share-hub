<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc"><title id="title">今週の解析探索</title><desc id="desc">前提計測から次の判断へ進む技術探索の概略</desc><rect width="1600" height="620" fill="#f4f4f4"/><g font-family="Arial,sans-serif" fill="#161616"><text x="70" y="85" font-size="30" fill="#525252">今週の作業は「精度を上げる実装」ではなく「何を比べるか決める測定」</text><g transform="translate(70 145)"><rect width="320" height="350" rx="8" fill="white" stroke="#8d8d8d" stroke-width="2"/><text x="28" y="60" font-size="26" fill="#0f62fe">01 / HUD</text><text x="28" y="120" font-size="36">時間軸で確定</text><text x="28" y="185" font-size="24">候補 72 → 18</text><text x="28" y="230" font-size="20">2本の短い動画で試算</text><text x="28" y="270" font-size="20">正解率はまだ不明</text><text x="28" y="315" font-size="18" fill="#525252">設計案・実装なし</text></g><g transform="translate(450 145)"><rect width="320" height="350" rx="8" fill="white" stroke="#8d8d8d" stroke-width="2"/><text x="28" y="60" font-size="26" fill="#0f62fe">02 / OCR</text><text x="28" y="120" font-size="36">CPU候補を比較</text><text x="28" y="185" font-size="24">Tesseract 391ms</text><text x="28" y="230" font-size="20">48枚中9枚が整数</text><text x="28" y="270" font-size="20">PP-OCRは未測定</text><text x="28" y="315" font-size="18" fill="#525252">比較の基準を確立</text></g><g transform="translate(830 145)"><rect width="320" height="350" rx="8" fill="white" stroke="#8d8d8d" stroke-width="2"/><text x="28" y="60" font-size="26" fill="#0f62fe">03 / 追跡・費用</text><text x="28" y="120" font-size="36">先に前提を確認</text><text x="28" y="185" font-size="24">検出 53 / 120</text><text x="28" y="230" font-size="20">デコードが約95%</text><text x="28" y="270" font-size="20">精度・実費は不明</text><text x="28" y="315" font-size="18" fill="#525252">条件揃えが次</text></g><g transform="translate(1210 145)"><rect width="320" height="350" rx="8" fill="#e8f0fe" stroke="#0f62fe" stroke-width="2"/><text x="28" y="60" font-size="26" fill="#0f62fe">NEXT / 人の判断</text><text x="28" y="120" font-size="36">入口と出口を開く</text><text x="28" y="185" font-size="24">PR #1をレビュー</text><text x="28" y="230" font-size="20">次の課題を1件選ぶ</text><text x="28" y="270" font-size="20">Todoは現在0件</text><text x="28" y="315" font-size="18" fill="#525252">自動昇格はしない</text></g><path d="M400 320h38m-8-10 10 10-10 10M780 320h38m-8-10 10 10-10 10M1160 320h38m-8-10 10 10-10 10" fill="none" stroke="#525252" stroke-width="4"/></g></svg>