<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#111"/></marker></defs><rect width="1000" height="360" fill="#fff"/><g font-family="sans-serif" fill="#111"><rect x="25" y="90" width="225" height="110" rx="6" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="43" y="135" font-size="21" fill="#111">画面から表示を切る</text><path d="M265,145 L335,145" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="350" y="90" width="260" height="110" rx="6" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="368" y="135" font-size="21" fill="#111">文字の形だけを比べる</text><path d="M625,145 L695,145" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="710" y="90" width="265" height="110" rx="6" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="728" y="135" font-size="21" fill="#111">変わった候補を返す</text><text x="40" y="245" font-size="23" fill="#111">① 表示領域（ROI）</text><text x="365" y="245" font-size="23" fill="#111">② 明るい文字を白に</text><text x="725" y="245" font-size="23" fill="#111">③ 時刻・変化量・理由</text><text x="70" y="320" font-size="27" fill="#111">この部品は「何という数字か」を読むOCRとは別の役目です。</text></g></svg>