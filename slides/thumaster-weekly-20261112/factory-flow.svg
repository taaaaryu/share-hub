<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><rect width="100%" height="100%" fill="#f4f4f4"/><style>text{font-family:Arial,'Noto Sans JP',sans-serif;fill:#161616}.small{font-size:22px;fill:#525252}.title{font-size:34px;font-weight:700}.body{font-size:25px}.blue{fill:#0f62fe}.green{fill:#198038}.white{fill:#fff}.card{fill:#fff;stroke:#8d8d8d;stroke-width:2}.line{stroke:#0f62fe;stroke-width:5;fill:none}</style><text x="70" y="84" class="title">課題を選ぶところから、レビューへ渡すまで</text><g transform="translate(70,145)"><rect class="card" width="260" height="420"/><rect class="blue" width="260" height="18"/><text x="24" y="72" class="small">人が選ぶ</text><text x="24" y="128" class="title">Todo</text><text x="24" y="186" class="body">作業する課題を</text><text x="24" y="226" class="body">1つ指定</text><text x="24" y="340" class="small">今回は0件</text><path class="line" d="M275 210h70m-18-18 18 18-18 18"/><rect class="card" x="360" width="260" height="420"/><rect class="blue" x="360" width="260" height="18"/><text x="384" y="72" class="small">OpenCode</text><text x="384" y="128" class="title">実装する</text><text x="384" y="186" class="body">専用ブランチで</text><text x="384" y="226" class="body">テストと変更</text><text x="384" y="340" class="small">作業対象なし</text><path class="line" d="M635 210h70m-18-18 18 18-18 18"/><rect class="card" x="720" width="260" height="420"/><rect class="blue" x="720" width="260" height="18"/><text x="744" y="72" class="small">GitHub</text><text x="744" y="128" class="title">Draft PR</text><text x="744" y="186" class="body">差分と結果を</text><text x="744" y="226" class="body">レビューへ渡す</text><text x="744" y="340" class="small">8件が未確認</text><path class="line" d="M995 210h70m-18-18 18 18-18 18"/><rect class="card" x="1080" width="260" height="420"/><rect class="green" x="1080" width="260" height="18"/><text x="1104" y="72" class="small">人が判断</text><text x="1104" y="128" class="title">Merge</text><text x="1104" y="186" class="body">レビュー後に</text><text x="1104" y="226" class="body">本流へ取り込む</text><text x="1104" y="340" class="small">今週は0件</text></g><text x="70" y="650" class="body">workerはBacklogから勝手に選ばず、確認なしでmergeもしない。</text><text x="70" y="710" class="small">入口と検査場が閉じていれば、完成品は増えない。</text></svg>