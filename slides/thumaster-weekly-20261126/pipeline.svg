<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650"><rect width="1600" height="650" fill="#f4f4f4"/><g font-family="Arial,sans-serif" fill="#161616"><text x="64" y="82" font-size="32" fill="#525252">変更が本体に届くには、入口・レビュー・受入を順に通る</text><g transform="translate(70 150)"><rect width="300" height="350" fill="white" stroke="#8d8d8d" stroke-width="2"/><text x="28" y="58" font-size="24" fill="#0f62fe">01 / 選ぶ</text><text x="28" y="135" font-size="42">Todo 0件</text><text x="28" y="190" font-size="21">着手の合図がない</text><text x="28" y="235" font-size="21">Backlogは計画棚</text><text x="28" y="300" font-size="18" fill="#525252">今週もここで停止</text></g><g transform="translate(435 150)"><rect width="300" height="350" fill="white" stroke="#8d8d8d" stroke-width="2"/><text x="28" y="58" font-size="24" fill="#0f62fe">02 / 作る</text><text x="28" y="135" font-size="42">自動実装</text><text x="28" y="190" font-size="21">選択後に1件だけ</text><text x="28" y="235" font-size="21">テストと説明を用意</text><text x="28" y="300" font-size="18" fill="#525252">今週は未到達</text></g><g transform="translate(800 150)"><rect width="300" height="350" fill="white" stroke="#8d8d8d" stroke-width="2"/><text x="28" y="58" font-size="24" fill="#0f62fe">03 / レビュー</text><text x="28" y="135" font-size="42">Draft 8本</text><text x="28" y="190" font-size="21">レビュー承認 0</text><text x="28" y="235" font-size="21">CIあり 4本</text><text x="28" y="300" font-size="18" fill="#525252">人の確認が必要</text></g><g transform="translate(1165 150)"><rect width="360" height="350" fill="#e8f0fe" stroke="#0f62fe" stroke-width="2"/><text x="28" y="58" font-size="24" fill="#0f62fe">04 / 受け入れ</text><text x="28" y="135" font-size="42">merge 0件</text><text x="28" y="190" font-size="21">本体への反映なし</text><text x="28" y="235" font-size="21">本番受入とは別段階</text><text x="28" y="300" font-size="18" fill="#525252">週例で順番を決める</text></g><path d="M380 320h42m-12-12 12 12-12 12M745 320h42m-12-12 12 12-12 12M1110 320h42m-12-12 12 12-12 12" fill="none" stroke="#525252" stroke-width="4"/><text x="70" y="575" font-size="21" fill="#525252">テストが通ること、レビュー承認、merge、本番での受入はそれぞれ別の証拠です。</text></g></svg>