<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360"><rect width="360" height="360" fill="white"/><g font-family="sans-serif"><rect x="10" y="5" width="340" height="105" rx="5" fill="#f5f5f5" stroke="#111"/><text x="25" y="33" font-size="18" fill="#111">画素差分：変わった点の割合</text><text x="25" y="62" font-size="18" fill="#111">基準：1.5％以上で変化</text><text x="25" y="91" font-size="18" fill="#111">0=黒、255=白。190超を白に</text><rect x="10" y="145" width="340" height="105" rx="5" fill="#f5f5f5" stroke="#111"/><text x="25" y="173" font-size="18" fill="#111">テンプレート照合：形の似かより</text><text x="25" y="202" font-size="18" fill="#111">既存の基準値を維持</text><text x="25" y="231" font-size="18" fill="#111">類似度0.86／安定確認0.96</text><text x="15" y="330" font-size="18" fill="#111">別の物差しとして切り替えて比べる</text></g></svg>