<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 580"><rect width="1500" height="580" fill="#f4f4f4"/><g font-family="Arial,sans-serif" fill="#161616"><text x="70" y="78" font-size="30" fill="#525252">TAA-43: いまある素材と、正解データに必要な幅</text><g transform="translate(80 145)"><rect width="540" height="340" fill="white" stroke="#8d8d8d" stroke-width="2"/><text x="32" y="56" font-size="26" fill="#0f62fe">現時点で確認できた素材</text><text x="32" y="135" font-size="52">2 本</text><text x="32" y="185" font-size="22">合計 48 秒</text><text x="32" y="228" font-size="22">解像度 1 種類</text><text x="32" y="286" font-size="19" fill="#525252">動画本体・画面・名前は掲載しない</text></g><g transform="translate(875 145)"><rect width="540" height="340" fill="white" stroke="#8d8d8d" stroke-width="2"/><text x="32" y="56" font-size="26" fill="#0f62fe">必要な評価条件</text><text x="32" y="135" font-size="52">10 条件</text><text x="32" y="185" font-size="22">背景だけの変化</text><text x="32" y="228" font-size="22">HUD変化・遷移・例外</text><text x="32" y="286" font-size="19" fill="#525252">条件ごとの正解ラベルが必要</text></g><path d="M660 315h190m-24-18 24 18-24 18" fill="none" stroke="#0f62fe" stroke-width="5"/><text x="665" y="270" font-size="20" fill="#525252">不足を埋める</text><text x="80" y="535" font-size="19" fill="#525252">素材を集めた、とは言えない。今回は既存素材の棚卸しと不足条件の見える化まで。</text></g></svg>