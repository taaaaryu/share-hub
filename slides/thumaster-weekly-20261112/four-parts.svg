<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><rect width="100%" height="100%" fill="#f4f4f4"/><style>text{font-family:Arial,'Noto Sans JP',sans-serif;fill:#161616}.small{font-size:22px;fill:#525252}.title{font-size:34px;font-weight:700}.body{font-size:25px}.blue{fill:#0f62fe}.green{fill:#198038}.white{fill:#fff}.card{fill:#fff;stroke:#8d8d8d;stroke-width:2}.line{stroke:#0f62fe;stroke-width:5;fill:none}</style><text x="70" y="84" class="title">今週できた4つの部品。効果は、実機と正解データでこれから測る。</text><g transform="translate(70,145)"><g><rect class="card" width="600" height="250"/><circle class="blue" cx="70" cy="70" r="36"/><text x="56" y="80" class="white title">1</text><text x="130" y="66" class="title">固定フレーム検証台</text><text x="34" y="132" class="body">同じ画像・イベントでOCRや</text><text x="34" y="174" class="body">命中部位を比べる器を追加。</text><text x="34" y="220" class="small">PR #5 / 実画像の精度は未測定</text></g><g transform="translate(650,0)"><rect class="card" width="600" height="250"/><circle class="blue" cx="70" cy="70" r="36"/><text x="56" y="80" class="white title">2</text><text x="130" y="66" class="title">逐次オーケストレーター</text><text x="34" y="132" class="body">複数課題を同時に触らず、</text><text x="34" y="174" class="body">前提とレビューゲートを守る。</text><text x="34" y="220" class="small">PR #6 / Mac実起動は未確認</text></g><g transform="translate(0,290)"><rect class="card" width="600" height="250"/><circle class="blue" cx="70" cy="70" r="36"/><text x="56" y="80" class="white title">3</text><text x="130" y="66" class="title">スマホ管理画面</text><text x="34" y="132" class="body">状態・課題・ログ・使用量を確認、</text><text x="34" y="174" class="body">許可した操作を安全に行う。</text><text x="34" y="220" class="small">PR #7 / ローカル表示のみ確認</text></g><g transform="translate(650,290)"><rect class="card" width="600" height="250"/><circle class="blue" cx="70" cy="70" r="36"/><text x="56" y="80" class="white title">4</text><text x="130" y="66" class="title">利用枠の自動停止</text><text x="34" y="132" class="body">残量が少ない時は止めて、回復後に</text><text x="34" y="174" class="body">同じ課題から安全に再開。</text><text x="34" y="220" class="small">PR #8 / 実API・再開未検証</text></g></g><text x="70" y="760" class="small">#6 → #7 → #8 は積み上げ構成で、前段レビューが必要。</text></svg>