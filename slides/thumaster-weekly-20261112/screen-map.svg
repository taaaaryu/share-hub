<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="100%" height="100%" fill="#f4f4f4"/><style>text{font-family:Arial,'Noto Sans JP',sans-serif;fill:#161616}.small{font-size:22px;fill:#525252}.title{font-size:34px;font-weight:700}.body{font-size:25px}.blue{fill:#0f62fe}.green{fill:#198038}.white{fill:#fff}.card{fill:#fff;stroke:#8d8d8d;stroke-width:2}.line{stroke:#0f62fe;stroke-width:5;fill:none}</style><text x="70" y="84" class="title">スマホ管理画面：表示と安全ゲートをローカルで確認</text><g transform="translate(80,130)"><rect class="card" width="430" height="610" rx="30"/><rect x="18" y="24" width="394" height="560" rx="16" fill="#111b29"/><text x="44" y="72" class="white small">THUMASTER / CONTROL</text><text x="44" y="126" class="white title">開発を、手のひらから。</text><rect x="40" y="154" width="350" height="46" rx="12" fill="#253a4b"/><text x="60" y="185" class="white body">● 待機中</text><rect x="40" y="220" width="350" height="122" rx="14" fill="#1b2a3b"/><text x="60" y="260" class="white body">現在の課題 / 実行操作</text><text x="60" y="300" class="white small">開始・停止は実行せず表示だけ確認</text><rect x="40" y="360" width="350" height="80" rx="14" fill="#1b2a3b"/><text x="60" y="408" class="white body">Issueの再実行・前提ゲート</text><rect x="40" y="460" width="350" height="100" rx="14" fill="#1b2a3b"/><text x="60" y="505" class="white body">利用枠・7日間の実績</text><text x="60" y="540" class="white small">合成データで表示確認</text></g><g transform="translate(600,180)"><text x="0" y="0" class="title">確認したこと</text><circle class="green" cx="18" cy="68" r="9"/><text x="48" y="77" class="body">待機中の状態が読める</text><circle class="green" cx="18" cy="138" r="9"/><text x="48" y="147" class="body">サービス・再実行・使用枠を区別</text><circle class="green" cx="18" cy="208" r="9"/><text x="48" y="217" class="body">開始/停止操作は行わない</text><circle class="green" cx="18" cy="278" r="9"/><text x="48" y="287" class="body">実際の利用量は取得しない</text><text x="0" y="390" class="small">図は画面構成の説明用イラスト。</text><text x="0" y="430" class="small">iPhone・Tailscale・Mac miniは</text><text x="0" y="470" class="small">未確認。実画面ではありません。</text></g></svg>